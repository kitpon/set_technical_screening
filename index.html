<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finansia HERO — Stock Analysis</title><style>
:root{--bg:#080d18;--panel:#111827;--line:#263248;--text:#e5e7eb;--muted:#91a0b8;--cyan:#22d3ee;--green:#34d399;--red:#fb7185;--amber:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#13203c,#080d18 40%);color:var(--text);font:14px system-ui,"Noto Sans Thai",sans-serif}header{padding:24px 30px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#080d18e8;backdrop-filter:blur(12px);z-index:5}h1{font-size:23px;margin:0 0 5px}.meta{color:var(--muted)}nav{display:flex;gap:8px;padding:14px 30px 0}.tab{border:1px solid var(--line);background:#111827;color:var(--muted);padding:10px 16px;border-radius:9px 9px 0 0;cursor:pointer}.tab.on{color:var(--cyan);border-bottom-color:var(--cyan)}main{padding:16px 30px}.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}.tools input,.tools select{background:#0c1424;color:var(--text);border:1px solid var(--line);padding:9px 11px;border-radius:8px}.card{background:#111827;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 210px)}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:9px 11px;border-bottom:1px solid #1d293c;text-align:right}th{position:sticky;top:0;background:#182236;color:#a9b6ca;cursor:pointer}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}button.chart{background:#143040;color:var(--cyan);border:1px solid #1b6375;border-radius:6px;padding:5px 8px;cursor:pointer}.hide{display:none}.modal{position:fixed;inset:0;background:#000c;display:none;z-index:20;padding:3vh 3vw}.modal.on{display:block}.box{height:94vh;background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:10px}.boxbar{height:38px;display:flex;justify-content:space-between;align-items:center}.box iframe,.box canvas{width:100%;height:calc(100% - 38px);border:0}.close{font-size:20px;background:none;border:0;color:white;cursor:pointer}@media(max-width:700px){header,main{padding-left:12px;padding-right:12px}nav{padding-left:12px;overflow:auto}}
</style></head><body><header><h1>Finansia HERO · Stock Analysis Dashboard</h1><div class="meta" id="meta"></div></header><nav id="tabs"></nav><main><div class="tools" id="tools"></div><div class="card"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></main>
<div class="modal" id="modal"><div class="box"><div class="boxbar"><span id="chartTitle"></span><span><a id="tvlink" target="_blank" style="color:#22d3ee">เปิดใน TradingView ↗</a> <button class="close" onclick="closeChart()">×</button></span></div><canvas id="chart"></canvas></div></div>
<script>let DATA;async function boot(){DATA=await fetch('dashboard_data.json').then(r=>{if(!r.ok)throw new Error('โหลดข้อมูลไม่สำเร็จ');return r.json()});const tabs=[['scanner','Scanner'],['td','TD Sequential'],['minervini','Minervini'],['vcp','VCP']];let state={tab:'scanner',tf:'daily',q:'',sector:'',special:''};
const fmt=v=>v==null?'—':typeof v==='number'?v.toLocaleString('th-TH',{maximumFractionDigits:2}):v;const yn=v=>v?'<span class="good">✓</span>':'<span class="bad">–</span>';
document.querySelector('#meta').textContent=`ข้อมูลล่าสุด ${DATA.meta.as_of} · ${DATA.meta.universe_count} หุ้น · SET 12 เดือน ${fmt(DATA.meta.set_12m_return)}%`;
function controls(){let h='<input id="q" placeholder="ค้นหาหุ้น" value="'+state.q+'"><select id="sector"><option value="">ทุกกลุ่มธุรกิจ</option>'+Object.keys(DATA.sectors).sort().map(x=>`<option ${state.sector===x?'selected':''}>${x}</option>`).join('')+'</select>';if(['scanner','td'].includes(state.tab))h+='<select id="tf">'+[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']].map(x=>`<option value="${x[0]}" ${state.tf===x[0]?'selected':''}>${x[1]}</option>`).join('')+'</select>';if(state.tab==='td')h+='<select id="special"><option value="">ทุกสถานะ</option><option value="near_buy">ใกล้ซื้อ</option><option value="near_sell">ใกล้หมดแรง</option></select>';if(state.tab==='minervini')h+='<select id="special"><option value="">ทุก Stage</option><option value="5">ผ่านครบ 5</option></select>';if(state.tab==='vcp')h+='<select id="special"><option value="">ทุก Stage</option><option value="4">ผ่านครบ 4</option><option value="breakout">กำลัง Breakout</option></select>';tools.innerHTML=h;tools.querySelectorAll('input,select').forEach(e=>e.oninput=()=>{state[e.id]=e.value;render()})}
function rows(){let a=state.tab==='scanner'||state.tab==='td'?DATA[state.tab][state.tf]:DATA[state.tab];return a.filter(x=>(!state.q||x.symbol.includes(state.q.toUpperCase()))&&(!state.sector||x.sector===state.sector)&&(!state.special||(state.tab==='td'?x.group===state.special:state.special==='breakout'?x.breakout_now:x.pass_count==state.special)))}
const defs={scanner:[['symbol','หุ้น'],['sector','กลุ่ม'],['close','ราคา'],['ma5','MA5'],['ma25','MA25'],['ma50','MA50'],['ma200','MA200'],['macd_line','MACD'],['macd_hist','Hist'],['rsi14','RSI'],['vol_ratio','Vol x']],td:[['symbol','หุ้น'],['sector','กลุ่ม'],['close','ราคา'],['setup_dir','Setup'],['setup_count','นับ Setup'],['setup_perfected','Perfected'],['countdown_dir','Countdown'],['countdown_count','นับ CD'],['group','สถานะ']],minervini:[['symbol','หุ้น'],['sector','กลุ่ม'],['close','ราคา'],['pass_count','ผ่าน'],['r1','R1'],['r2','R2'],['r3','R3'],['r4','R4'],['r5','R5'],['rs_rating','RS Rating'],['rs_vs_index','เทียบ SET %']],vcp:[['symbol','หุ้น'],['sector','กลุ่ม'],['pass_count','ผ่าน'],['has_base','ฐาน'],['pullbacks_ok','Pullbacks'],['tightening','หดตัว'],['volume_dry','Vol แห้ง'],['breakout_now','Breakout'],['last_pivot_high','Pivot High']]};
function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.id===state.tab));controls();let d=defs[state.tab],a=rows();head.innerHTML='<tr>'+d.map(x=>`<th>${x[1]}</th>`).join('')+'<th>กราฟ</th></tr>';body.innerHTML=a.map(r=>'<tr>'+d.map(([k])=>`<td>${typeof r[k]==='boolean'?yn(r[k]):k.endsWith('_dir')?(r[k]<0?'Buy':r[k]>0?'Sell':'—'):fmt(r[k])}</td>`).join('')+`<td><button class="chart" onclick="openChart('${r.symbol}')">📈 ดูกราฟ</button></td></tr>`).join('')||'<tr><td colspan="20" style="text-align:center">ไม่พบข้อมูล</td></tr>'}
tabs.forEach(([id,label])=>{let b=document.createElement('button');b.className='tab';b.dataset.id=id;b.textContent=label;b.onclick=()=>{state.tab=id;state.special='';render()};document.querySelector('#tabs').append(b)});
function line(ctx,a,mapY,color,w=1.3){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();a.forEach((v,i)=>{if(v==null)return;let x=X(i),y=mapY(v);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
function drawLocal(s){let a=DATA.charts[s]||[],c=chart,box=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=box.width*dpr;c.height=box.height*dpr;let x=c.getContext('2d');x.scale(dpr,dpr);let W=box.width,H=box.height,L=54,R=48,T=18,priceH=H*.61,macT=priceH+34,macH=H*.19,rsiT=macT+macH+25,rsiH=H-rsiT-24;x.fillStyle='#0b1220';x.fillRect(0,0,W,H);window.X=i=>L+(i+.5)*(W-L-R)/a.length;
 let lo=Math.min(...a.map(r=>r[3])),hi=Math.max(...a.map(r=>r[2])),py=v=>T+(hi-v)/(hi-lo)*priceH;x.strokeStyle='#253248';x.fillStyle='#8492a8';x.font='11px system-ui';for(let j=0;j<5;j++){let v=lo+(hi-lo)*j/4,y=py(v);x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke();x.fillText(v.toFixed(2),W-R+5,y+3)}
 let bw=Math.max(1,(W-L-R)/a.length*.65);a.forEach((r,i)=>{let xx=X(i),up=r[4]>=r[1],col=up?'#34d399':'#fb7185';x.strokeStyle=col;x.fillStyle=col;x.beginPath();x.moveTo(xx,py(r[2]));x.lineTo(xx,py(r[3]));x.stroke();let y=Math.min(py(r[1]),py(r[4])),h=Math.max(1,Math.abs(py(r[1])-py(r[4])));x.fillRect(xx-bw/2,y,bw,h);
  let sd=r[8],sc=r[9],perfect=r[10],cd=r[11],cc=r[12],prev=i?a[i-1][12]:0;x.textAlign='center';x.font=perfect?'bold 10px system-ui':'9px system-ui';if(sc>0&&sc<=9){x.fillStyle=sd<0?'#34d399':'#fb7185';x.fillText(sc+(perfect?'★':''),xx,sd<0?py(r[3])+13:py(r[2])-6)}if(cc>0&&cc!==prev){x.fillStyle=cd<0?'#67e8f9':'#fbbf24';x.fillText(cc,xx,cd<0?py(r[3])+25:py(r[2])-18)}});x.textAlign='left';x.fillStyle='#a9b6ca';x.fillText('ราคา + TD Sequential (★ perfected)',L,12);
 let mac=[...a.flatMap(r=>[r[5],r[6]])].filter(Number.isFinite),mn=Math.min(0,...mac),mx=Math.max(0,...mac),my=v=>macT+(mx-v)/(mx-mn||1)*macH;x.strokeStyle='#253248';x.beginPath();x.moveTo(L,my(0));x.lineTo(W-R,my(0));x.stroke();line(x,a.map(r=>r[5]),my,'#22d3ee');line(x,a.map(r=>r[6]),my,'#fbbf24');x.fillStyle='#a9b6ca';x.fillText('MACD 12,26,9',L,macT-5);
 let ry=v=>rsiT+(100-v)/100*rsiH;[30,70].forEach(v=>{x.strokeStyle='#384660';x.setLineDash([4,4]);x.beginPath();x.moveTo(L,ry(v));x.lineTo(W-R,ry(v));x.stroke()});x.setLineDash([]);line(x,a.map(r=>r[7]),ry,'#c084fc');x.fillStyle='#a9b6ca';x.fillText('RSI 14',L,rsiT-5);x.fillText(a[0]?.[0]||'',L,H-5);x.textAlign='right';x.fillText(a.at(-1)?.[0]||'',W-R,H-5)}
async function openChart(s){if(!DATA.charts[s])DATA.charts[s]=await fetch('chart_data/symbol_'+encodeURIComponent(s)+'.json').then(r=>{if(!r.ok)throw new Error('ไม่พบข้อมูลกราฟ '+s);return r.json()});let sym=DATA.symbols_map[s];chartTitle.textContent=s+' · กราฟ Daily ในเครื่อง';tvlink.href='https://www.tradingview.com/chart/?symbol='+encodeURIComponent(sym);modal.classList.add('on');requestAnimationFrame(()=>drawLocal(s))}function closeChart(){modal.classList.remove('on')}modal.onclick=e=>{if(e.target===modal)closeChart()};render();let preview=new URLSearchParams(location.search).get('chart');if(preview&&DATA.charts[preview])openChart(preview);}boot().catch(e=>{document.body.innerHTML='<main><h2>ไม่สามารถโหลด Dashboard</h2><p>'+e.message+'</p></main>'});</script></body></html>
